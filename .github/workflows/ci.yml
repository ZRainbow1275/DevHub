name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm typecheck

      - name: No emoji guard
        run: pnpm check:no-emoji

      - name: Zod source of truth
        run: pnpm check:zod-sot

      - name: License policy check
        run: pnpm check:license

      - name: SBOM generation check
        run: pnpm check:sbom

      - name: No cloud dependency guard
        run: pnpm check:no-cloud-deps

      - name: No OCR dependency guard
        run: pnpm check:no-ocr-deps

      - name: Zero egress diagnostic guard
        run: pnpm exec vitest run src/main/services/R8RuntimeService.test.ts --maxWorkers=1 -t "without opening outbound network clients"

      - name: i18n coverage check
        run: pnpm i18n:check

      - name: Run unit tests
        run: pnpm test -- --run

      - name: Build application
        run: pnpm build

      - name: Accessibility axe smoke
        run: pnpm test:e2e -- --grep "R8.B spec-16" --workers=1 --reporter=line

  test-linux:
    runs-on: ubuntu-latest

    steps:
